
name: ShortVideoTranslator CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ShortVideoTranslator.slnx

      - name: Build solution
        run: dotnet build ShortVideoTranslator.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ShortVideoTranslator.Tests/ShortVideoTranslator.Tests.csproj --configuration Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ShortVideoTranslator.Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ShortVideoTranslator.Frontend
        run: npm ci

      - name: Check frontend
        working-directory: ShortVideoTranslator.Frontend
        run: npm run lint && npm test && npm run build

      - name: Check backup and restore tools
        run: python3 scripts/tests/test_backup_restore.py -v

      - name: Install functional test prerequisites
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify real API restart, clients and isolated restore
        run: python3 scripts/verify_operations.py

      - name: Install Chromium for browser regression
        working-directory: ShortVideoTranslator.Frontend
        run: npx playwright install --with-deps chromium

      - name: Verify browser GPS, audio and offline fixtures
        working-directory: ShortVideoTranslator.Frontend
        run: npm run test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: artifacts/member2/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish Backend API
        run: dotnet publish ShortVideoTranslator.Api/ShortVideoTranslator.Api.csproj --configuration Release --no-restore --output ./publish

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortVideoTranslator-Backend
          path: ./publish/
          if-no-files-found: error
          retention-days: 7

  docker-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Docker demo and verify persistent volumes
        run: bash scripts/verify_docker.sh

  supabase-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Disposable CI database only; never use live Supabase credentials here.
          POSTGRES_PASSWORD: ci-fixture-password
          POSTGRES_DB: smarttour_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: smarttour_tests
      PGPASSWORD: ci-fixture-password
      SMARTTOUR_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=smarttour_tests;Username=postgres;Password=ci-fixture-password;SSL Mode=Disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated six-table schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -f database/postgres/002_smarttour_compact.sql
          psql -X -v ON_ERROR_STOP=1 -f database/postgres/005_six_table_backend.sql
      - name: Verify PostgreSQL adapter and read-only report
        run: dotnet test ShortVideoTranslator.Tests/ShortVideoTranslator.Tests.csproj -c Release --filter 'FullyQualifiedName~Postgres'
      - name: Verify PowerShell start and read-only review flows
        run: python3 scripts/tests/test_supabase_launcher.py
      - name: Save fixture report (not live Supabase data)
        run: |
          mkdir -p artifacts
          export Storage__PostgresConnectionString="$SMARTTOUR_TEST_POSTGRES"
          dotnet run --project ShortVideoTranslator.Api -c Release --no-build -- --ReviewPostgres=true --ImportPostgres=false > artifacts/supabase-review-fixture.json
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-review-fixture
          path: artifacts/supabase-review-fixture.json
          if-no-files-found: error
