
name: ShortVideoTranslator CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ShortVideoTranslator.slnx

      - name: Build solution
        run: dotnet build ShortVideoTranslator.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ShortVideoTranslator.Tests/ShortVideoTranslator.Tests.csproj --configuration Release --no-restore
