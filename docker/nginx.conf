# The origin is loopback-only on the host; Cloudflare overwrites CF-Connecting-IP.
map $http_cf_connecting_ip $visitor_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}
map $http_x_forwarded_proto $visitor_scheme {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $visitor_ip;
        proxy_set_header X-Forwarded-Proto $visitor_scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
